# Regresi Playwright untuk skripsi: Run A (1 worker) lalu Run B (10 worker),
# berurutan di mesin ubuntu-latest, think time 1,2 s & load time 10 s
# (timing.helper.ts), retries 0.
#
# Dipicu oleh push ke branch Testing/Yovela (workflow_dispatch hanya
# bisa dipakai bila file ini ada di branch default)
#
# Tidak butuh Secrets: URL dan akun uji ditulis langsung di spec/helper,
# THINK_TIME_MS / LOAD_TIME_MS / VITE_API_URL punya nilai default.
#
# Hasil run:
#   reports/results.json   -> hasil test (dibaca script bug report)
#   reports/Bug Report - Yovela Limited - <tanggal>.xlsx
#   reports/attachments/   -> screenshot tiap bug
#   playwright-report/     -> HTML report
name: Yovela Testing

on:
  push:
    branches: [Testing/Yovela]

jobs:
  test:
    name: Regression ${{ matrix.workers }} worker
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # Run A lalu Run B, tidak bersamaan (server dev dipakai bersama tim)
      max-parallel: 1
      matrix:
        workers: [10]
    steps:
      - uses: actions/checkout@v4

      # Versi pnpm sama dengan yang dipakai membuat pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # pnpm-workspace.yaml belum memutuskan allowBuilds (bcrypt, core-js,
      # esbuild, lefthook), sehingga di CI pnpm gagal dengan
      # ERR_PNPM_IGNORED_BUILDS. Build script tersebut tidak dibutuhkan untuk
      # menjalankan Playwright, jadi cukup dilewati.
      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - run: pnpm exec playwright install --with-deps chromium

      - name: Baca pola retest
        run: |
          pola="$(grep -v '^#' .github/retest-grep.txt 2>/dev/null | tr -d '\r\n' || true)"
          echo "RETEST_GREP=$pola" >> "$GITHUB_ENV"

      - name: Catat mesin dan waktu mulai
        run: |
          {
            echo "## Run ${{ matrix.workers }} worker"
            echo ""
            echo "| Item | Nilai |"
            echo "|---|---|"
            echo "| Mesin | $(lsb_release -ds), $(nproc) vCPU, $(free -g | awk '/Mem:/{print $2}') GB RAM |"
            echo "| CPU | $(lscpu | sed -n 's/^Model name:[[:space:]]*//p') |"
            echo "| Node | $(node --version) |"
            echo "| Playwright | $(pnpm exec playwright --version) |"
            if [ -n "$RETEST_GREP" ]; then echo "| Mode | retest: \`$RETEST_GREP\` |"; else echo "| Mode | run penuh |"; fi
            echo "| Mulai (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Retest: bila .github/retest-grep.txt berisi pola, hanya test yang judulnya
      # cocok yang dijalankan (mis. TC yang diperbaiki setelah run penuh). Kosongkan
      # file tersebut untuk kembali ke run penuh.
      #
      # Hasil JSON ditaruh di reports/results.json supaya bisa dibaca
      # scripts/generateBugReport.ts (REPORT_DIR=reports). Dua nama env var
      # dipakai karena Playwright >= 1.45 memakai PLAYWRIGHT_JSON_OUTPUT_FILE
      # dan nama lama PLAYWRIGHT_JSON_OUTPUT_NAME; keduanya menunjuk file sama.
      # Reporter (list/html/json) diambil dari playwright.config.ts, jadi tidak
      # perlu --reporter di sini (flag CLI akan mengabaikan outputFile di config).
      - name: Jalankan pengujian
        env:
          SITE: yovela
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/results.json
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/results.json
        run: |
          mkdir -p reports
          pnpm exec playwright test \
            --project=chromium \
            --workers=${{ matrix.workers }} \
            --retries=0 \
            ${RETEST_GREP:+--grep "$RETEST_GREP"} \
            "src/tests/common/api.spec.ts" \
            "src/tests/common/contact.spec.ts" \
            "src/tests/common/crossBrowsing.spec.ts" \
            "src/tests/common/footer.spec.ts" \
            "src/tests/common/general.spec.ts" \
            "src/tests/common/hero.spec.ts" \
            "src/tests/common/navigationBar.spec.ts" \
            "src/tests/sites/Yovela/about.spec.ts" \
            "src/tests/sites/Yovela/contactInfo.spec.ts" \
            "src/tests/sites/Yovela/globalTrade.spec.ts" \
            "src/tests/sites/Yovela/product.spec.ts" \
            "src/tests/sites/Yovela/whyUs.spec.ts"

      # Bug report Excel dibuat dari reports/results.json. Tetap jalan walau
      # test gagal (if: always()); bila results.json tidak ada, step ini hanya
      # memberi warning agar kegagalan step test tidak tertutupi.
      - name: Generate bug report
        if: always()
        env:
          SITE: nexus
          REPORT_DIR: reports
          TESTER: ${{ github.actor }}
        run: |
          if [ ! -f reports/results.json ]; then
            echo "::warning::reports/results.json tidak ada, bug report dilewati"
            exit 0
          fi
          pnpm run bug-report
          {
            echo ""
            echo "### Bug report (${{ matrix.workers }} worker)"
            echo ""
            find reports -maxdepth 2 -type f \( -name '*.xlsx' -o -name '*.json' \) -printf '| `%p` | %s byte |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Catat waktu selesai
        if: always()
        run: |
          echo "| Selesai (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.workers }}w
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 30
          if-no-files-found: warn
